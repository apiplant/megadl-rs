[package]
name = "megadl"
version = "0.1.0"
edition = "2021"
description = "A command-line downloader and terminal download manager for mega.nz links"
license = "MIT"
repository = "https://github.com/apiplant/megadl-rs"

[lib]
name = "megadl"
path = "src/lib.rs"

[[bin]]
name = "megadl"
path = "src/bin/cli.rs"

[[bin]]
name = "megadl-tui"
path = "src/bin/tui.rs"

[dependencies]
rustls = { version = "0.23", default-features = false, features = ["std", "ring", "tls12"] }
webpki-roots = "0.26"
aes = "0.8"
ctr = "0.9"
cbc = { version = "0.1", features = ["alloc"] }
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
